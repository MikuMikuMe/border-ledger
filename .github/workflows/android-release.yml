name: Android private release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static release gates
        shell: pwsh
        run: pwsh -NoProfile -File android/task17-static-check.ps1 -RequireAndroidToolchain
      - name: Require protected signing inputs
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($name in @('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "Missing protected signing secret: $name" }
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Keep release setup aligned with CI; the historical `tools`
          # package no longer exists in the Android repository.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Decode owner-controlled keystore outside the repository
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'border-ledger-release.jks'), $bytes)
      - name: Assemble release with the existing Gradle wrapper
        working-directory: android
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}\border-ledger-release.jks
        run: .\gradlew.bat assembleRelease --no-daemon
      - name: Sign, verify, and checksum the APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $apk = Get-ChildItem -LiteralPath 'android/app/build/outputs/apk/release' -Filter '*.apk' | Select-Object -First 1
          if ($null -eq $apk) { throw 'Gradle produced no release APK.' }
          $apksigner = Get-ChildItem -Path "$env:ANDROID_HOME\build-tools" -Filter apksigner.bat -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $apksigner) { throw 'Android build-tools apksigner is unavailable; no signed APK is claimed.' }
          & $apksigner.FullName sign --ks "$env:RUNNER_TEMP\border-ledger-release.jks" --ks-pass "pass:$env:ANDROID_KEYSTORE_PASSWORD" --ks-key-alias "$env:ANDROID_KEY_ALIAS" --key-pass "pass:$env:ANDROID_KEY_PASSWORD" $apk.FullName
          & $apksigner.FullName verify --verbose $apk.FullName
          Get-FileHash -Algorithm SHA256 -LiteralPath $apk.FullName | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: border-ledger-signed-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

