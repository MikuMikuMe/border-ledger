name: Application release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - src/**
      - index.html
      - contracts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - public/**
      - scripts/detect-android-release-change.mjs
      - .github/workflows/android-release.yml

permissions:
  contents: read

jobs:
  detect-app-change:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.detect.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Distinguish app changes from backend-only package changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'app_changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'app_changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_paths="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          package_diff="$(git diff --unified=0 "$BEFORE_SHA" "$CURRENT_SHA" -- package.json package-lock.json)"
          result="$(CHANGED_PATHS="$changed_paths" PACKAGE_DIFF="$package_diff" EVENT_NAME="$EVENT_NAME" node scripts/detect-android-release-change.mjs)"
          echo "$result" >> "$GITHUB_OUTPUT"
          if [[ "$result" == 'app_changed=false' ]]; then
            echo 'Only backend paths and backend dependency manifests changed; Android release is skipped.'
          fi

  release:
    # A backend-only change never matches the path filter above. Manual runs
    # are intentionally limited to main so a feature branch cannot publish a
    # production APK or overwrite a release tag.
    needs: detect-app-change
    if: github.ref == 'refs/heads/main' && needs.detect-app-change.outputs.app_changed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Run web release gates
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Verify Android release gates
        shell: pwsh
        run: pwsh -NoProfile -File android/task17-static-check.ps1 -RequireAndroidToolchain

      - name: Require protected signing inputs
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($name in @('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')) {
            $value = (Get-Item "env:$name").Value
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing protected signing secret: $name"
            }
          }

      - name: Compute deterministic release identity
        id: release-version
        shell: pwsh
        env:
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          $versionCode = [int]$env:RELEASE_VERSION_CODE
          $versionName = "0.1.$versionCode"
          "version_code=$versionCode" >> $env:GITHUB_OUTPUT
          "version_name=$versionName" >> $env:GITHUB_OUTPUT
          "VERSION_CODE=$versionCode" >> $env:GITHUB_ENV
          "VERSION_NAME=$versionName" >> $env:GITHUB_ENV

      - name: Decode owner-controlled keystore outside the repository
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'border-ledger-release.jks'
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes($path, $bytes)
          "ANDROID_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV

      - name: Assemble release with deterministic version
        working-directory: android
        shell: pwsh
        env:
          RELEASE_VERSION_CODE: ${{ steps.release-version.outputs.version_code }}
          RELEASE_VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
        run: .\gradlew.bat assembleRelease --no-daemon "-PreleaseVersionCode=$env:RELEASE_VERSION_CODE" "-PreleaseVersionName=$env:RELEASE_VERSION_NAME"

      - name: Sign, verify, inspect, and checksum the APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $unsigned = Get-ChildItem -LiteralPath 'android/app/build/outputs/apk/release' -Filter '*-unsigned.apk' | Select-Object -First 1
          if ($null -eq $unsigned) {
            $unsigned = Get-ChildItem -LiteralPath 'android/app/build/outputs/apk/release' -Filter '*.apk' | Select-Object -First 1
          }
          if ($null -eq $unsigned) { throw 'Gradle produced no release APK.' }

          $buildTools = Get-ChildItem -LiteralPath (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $buildTools) { throw 'Android build-tools are unavailable; no signed APK is claimed.' }
          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'
          $aapt2 = Join-Path $buildTools.FullName 'aapt2.exe'
          if (-not (Test-Path -LiteralPath $apksigner)) { throw 'Android build-tools apksigner is unavailable; no signed APK is claimed.' }
          if (-not (Test-Path -LiteralPath $aapt2)) { throw 'Android build-tools aapt2 is unavailable; release manifest cannot be inspected.' }

          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-artifacts'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $artifact = Join-Path $artifactDirectory "border-ledger-$env:VERSION_NAME.apk"

          & $apksigner sign --ks $env:ANDROID_KEYSTORE_PATH --ks-pass 'env:ANDROID_KEYSTORE_PASSWORD' --ks-key-alias $env:ANDROID_KEY_ALIAS --key-pass 'env:ANDROID_KEY_PASSWORD' --out $artifact $unsigned.FullName
          if ($LASTEXITCODE -ne 0) { throw 'apksigner sign failed.' }
          & $apksigner verify --verbose $artifact
          if ($LASTEXITCODE -ne 0) { throw 'apksigner verification failed.' }

          $badging = (& $aapt2 dump badging $artifact) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'aapt2 badging inspection failed.' }
          if ($badging -notmatch "package: name='com\.lofuyu\.borderledger'") { throw 'Release APK package identity is not com.lofuyu.borderledger.' }
          if ($badging -match "com\.lofuyu\.borderledger\.probe") { throw 'Debug probe application identity leaked into release APK.' }
          $manifestTree = (& $aapt2 dump xmltree --file AndroidManifest.xml $artifact) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'aapt2 manifest inspection failed.' }
          if ($manifestTree -match 'FxReportPreviewActivity|FX_REPORT_PREVIEW') { throw 'Debug-only FX preview leaked into release APK.' }

          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant()
          "$checksum  $([IO.Path]::GetFileName($artifact))" | Set-Content -NoNewline -LiteralPath (Join-Path $artifactDirectory 'SHA256SUMS.txt')

      - uses: actions/upload-artifact@v4
        with:
          name: border-ledger-android-${{ steps.release-version.outputs.version_name }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish or update the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
        run: |
          $tag = "android-v$env:VERSION_NAME"
          $files = @(Get-ChildItem -LiteralPath 'release-artifacts' -File | ForEach-Object { $_.FullName })
          $notes = Join-Path $env:RUNNER_TEMP 'border-ledger-release-notes.md'
          @(
            "Border Ledger Android $env:VERSION_NAME"
            ''
            "Source commit: $env:GITHUB_SHA"
            'The APK is signed and verified by the protected GitHub Actions release job.'
            'See SHA256SUMS.txt for the artifact checksum.'
          ) | Set-Content -LiteralPath $notes

          & gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            & gh release upload $tag @files --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            & gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Border Ledger Android $env:VERSION_NAME" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed for $tag." }
