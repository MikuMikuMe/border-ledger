name: Android release candidate

on:
  push:
    branches: [main]
    paths:
      - android/**
      - tests/**
      - vitest.config.ts
      - mobile/**
      - shared/**
      - src/**
      - contracts/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - public/**
      - .github/workflows/android-release.yml
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed commit SHA at the current main tip
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-candidate-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-unsigned:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Require the source SHA for this main build
        id: source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Release candidates may be built only from main.' }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_sha must be a full 40-character commit SHA.' }
          if ($env:SOURCE_SHA.ToLowerInvariant() -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'source_sha must equal the workflow main SHA.' }
          if ((git rev-parse HEAD).Trim().ToLowerInvariant() -ne $env:SOURCE_SHA.ToLowerInvariant()) { throw 'The checked-out tree does not match source_sha.' }
          "source_sha=$($env:SOURCE_SHA.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Run web and Worker release gates
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix mobile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test -- --reporter=dot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE

      - name: Validate isolated React Native package
        working-directory: mobile
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run codegen
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run bundle:release
          exit $LASTEXITCODE

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools build-tools;36.0.0

      - name: Install Android 17 preview platform
        shell: pwsh
        run: |
          $sdkmanager = Get-ChildItem -LiteralPath (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Filter 'sdkmanager.bat' -File -Recurse | Select-Object -First 1
          if (-not $sdkmanager) { throw 'Android SDK command-line tools were not installed.' }
          & $sdkmanager.FullName --install 'platforms;android-37.0' --channel=3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run Android validation and build unsigned production APK
        working-directory: android
        shell: pwsh
        env:
          ORG_GRADLE_PROJECT_borderLedgerCxxRoot: ${{ runner.temp }}/bl-cxx
        run: |
          pwsh -NoProfile -File task17-static-check.ps1 -RequireAndroidToolchain
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\gradlew.bat :app:lintDebug :app:testDebugUnitTest :sharedCore:testAndroidHostTest :app:assembleRelease --no-daemon --console=plain -PmobileEnvironment=production -PreleaseVersionCode=1000 '-PreleaseVersionName=0.2.0'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\react-native-host-check.ps1 -Merged
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $apk = 'app/build/outputs/apk/release/app-release-unsigned.apk'
          if (-not (Test-Path -LiteralPath $apk)) { throw 'The unsigned production APK was not produced.' }
          New-Item -ItemType Directory -Path '../unsigned-artifact' -Force | Out-Null
          Copy-Item -LiteralPath $apk -Destination '../unsigned-artifact/app-release-unsigned.apk'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unsigned-${{ github.run_id }}
          path: unsigned-artifact/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  android-instrumentation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Require the source SHA for this main build
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "${SOURCE_SHA,,}" = "${GITHUB_SHA,,}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Reclaim disk space for Android SDK and native builds
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          tool-cache: false
          swap-storage: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install React Native package
        working-directory: mobile
        run: npm ci

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Install Android 17 preview platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager"
          "$sdkmanager" --install "platforms;android-37.0" --channel=3
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation suite on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: cd android && bash gradlew :app:connectedDebugAndroidTest -PreactNativeArchitectures=x86_64 --no-daemon --console=plain --max-workers=2 --stacktrace

  sign-artifact:
    needs: [build-unsigned, android-instrumentation]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-production-signing
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_CERT_SHA256: 1ff2a25e39136eefa79d23cc7531f702b2a162280538410509ca2ff65b4744ed
      SOURCE_SHA: ${{ needs.build-unsigned.outputs.source_sha }}
      VERSION_CODE: '1000'
      VERSION_NAME: '0.2.0'
    steps:
      # This job is defined by the main-branch workflow. It intentionally has
      # no checkout and executes no files or scripts from the candidate APK.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-unsigned-${{ github.run_id }}
          path: unsigned-artifact

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools build-tools;36.0.0

      - name: Require protected signing inputs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Verify version floor against published Android APKs
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = (& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Published Android versions could not be enumerated; refusing version 1000.' }
          $androidReleases = @($releases | Where-Object { -not $_.isDraft -and $_.tagName -match '^android-v' })
          foreach ($release in $androidReleases) {
            $downloadDir = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $downloadDir | Out-Null
            & gh release download $release.tagName --repo $env:GITHUB_REPOSITORY --pattern '*.apk' --dir $downloadDir
            if ($LASTEXITCODE -ne 0) { throw "Published Android APK for $($release.tagName) could not be inspected; refusing the candidate." }
            $apks = @(Get-ChildItem -LiteralPath $downloadDir -Filter '*.apk' -File)
            if ($apks.Count -ne 1) { throw "Expected one APK in $($release.tagName); refusing to guess its version." }
            $apkBadging = (& "$env:ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging $apks[0].FullName) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect version of $($release.tagName)." }
            $version = [regex]::Match($apkBadging, "versionCode='(\d+)'")
            if (-not $version.Success) { throw "No Android version code in $($release.tagName); refusing to guess." }
            if ([int]$version.Groups[1].Value -ge 1000) { throw "Published Android version $($version.Groups[1].Value) is not lower than candidate 1000." }
          }

      - name: Sign and verify production APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $unsigned = Join-Path $env:GITHUB_WORKSPACE 'unsigned-artifact/app-release-unsigned.apk'
          if (-not (Test-Path -LiteralPath $unsigned)) { throw 'The downloaded unsigned APK is missing.' }
          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0'
          $apksigner = Join-Path $buildTools 'apksigner'
          $aapt2 = Join-Path $buildTools 'aapt2'
          $keystore = Join-Path $env:RUNNER_TEMP 'border-ledger-release.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-artifacts'
          New-Item -ItemType Directory -Path $artifactDirectory | Out-Null
          $artifactName = "border-ledger-$env:VERSION_NAME.apk"
          $signed = Join-Path $artifactDirectory $artifactName
          & $apksigner sign --ks $keystore --ks-pass 'env:ANDROID_KEYSTORE_PASSWORD' --ks-key-alias $env:ANDROID_KEY_ALIAS --key-pass 'env:ANDROID_KEY_PASSWORD' --out $signed $unsigned
          if ($LASTEXITCODE -ne 0) { throw 'apksigner sign failed.' }
          $certificateOutput = (& $apksigner verify --verbose --print-certs $signed 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'apksigner verification failed.' }
          $cert = [regex]::Match($certificateOutput, 'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F:]+)')
          if (-not $cert.Success) { throw 'The release certificate fingerprint could not be read.' }
          $fingerprint = $cert.Groups[1].Value.Replace(':', '').ToLowerInvariant()
          if ($fingerprint -ne $env:EXPECTED_CERT_SHA256) { throw 'Release certificate does not match the Samsung installation and Android App Links identity.' }
          $badging = (& $aapt2 dump badging $signed) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'APK manifest inspection failed.' }
          if ($badging -notmatch "package: name='com\.lofuyu\.borderledger'.*versionCode='1000'.*versionName='0\.2\.0'") { throw 'APK identity is not com.lofuyu.borderledger versionCode 1000 / 0.2.0.' }
          $manifestTree = (& $aapt2 dump xmltree --file AndroidManifest.xml $signed) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Release manifest inspection failed.' }
          if ($manifestTree -match 'com\.lofuyu\.borderledger\.probe|ReactNativeActivity|FixtureHost|PreviewActivity') { throw 'A debug-only component leaked into the release manifest.' }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Candidate source SHA is invalid.' }
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $signed).Hash.ToLowerInvariant()
          "$checksum  $artifactName" | Set-Content -Encoding utf8 -LiteralPath (Join-Path $artifactDirectory 'SHA256SUMS.txt')
          @{
            schemaVersion = 1
            sourceSha = $env:SOURCE_SHA
            packageId = 'com.lofuyu.borderledger'
            versionCode = 1000
            versionName = '0.2.0'
            mobileEnvironment = 'production'
            apkFileName = $artifactName
            apkSha256 = $checksum
            signingCertificateSha256 = $fingerprint
            workflowRunId = $env:GITHUB_RUN_ID
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 -LiteralPath (Join-Path $artifactDirectory 'candidate-manifest.json')

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signed-${{ github.run_id }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  create-candidate-draft:
    needs: [build-unsigned, android-instrumentation, sign-artifact]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_SHA: ${{ needs.build-unsigned.outputs.source_sha }}
      VERSION_CODE: '1000'
      VERSION_NAME: '0.2.0'
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-signed-${{ github.run_id }}
          path: release-artifacts

      - name: Create a new unpublished candidate release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "android-v$env:VERSION_NAME"
          $existingRelease = & gh release view $tag --repo $env:GITHUB_REPOSITORY 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; release assets are never overwritten." }
          $existingRef = & gh api -i "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Git tag $tag already exists; release tags are never replaced." }
          if (($existingRef -join "`n") -notmatch '404') { throw 'Tag absence could not be verified; refusing to create a candidate.' }
          $notes = Join-Path $env:RUNNER_TEMP 'candidate-notes.md'
          @(
            "Border Ledger Android $env:VERSION_NAME — unpublished candidate"
            ''
            "Source commit: $env:SOURCE_SHA"
            "APK SHA-256: $((Get-Content (Join-Path $env:GITHUB_WORKSPACE 'release-artifacts/SHA256SUMS.txt')).Split(' ')[0])"
            'This draft is not production-approved. Promote only after the release plan acceptance gates pass.'
          ) | Set-Content -Encoding utf8 -LiteralPath $notes
          $files = @(Get-ChildItem -LiteralPath 'release-artifacts' -File | ForEach-Object { $_.FullName })
          & gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --draft --title "Border Ledger Android $env:VERSION_NAME candidate" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "Draft candidate creation failed for $tag." }
