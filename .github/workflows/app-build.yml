name: App validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - android/**
      - mobile/**
      - shared/**
      - src/**
      - index.html
      - contracts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - public/**
      - .github/workflows/app-build.yml
      - .github/workflows/android-release.yml
  push:
    paths:
      - android/**
      - mobile/**
      - shared/**
      - src/**
      - index.html
      - contracts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - public/**
      - .github/workflows/app-build.yml
      - .github/workflows/android-release.yml

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm run typecheck
      - run: npm run build

  android-toolchain:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.availability.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Gradle wrapper availability
        id: availability
        shell: pwsh
        run: |
          $wrapper = Test-Path -LiteralPath 'android/gradlew.bat' -PathType Leaf
          $jar = Test-Path -LiteralPath 'android/gradle/wrapper/gradle-wrapper.jar' -PathType Leaf
          if ($wrapper -and $jar) {
            'available=true' >> $env:GITHUB_OUTPUT
            Write-Output 'Gradle wrapper script and JAR are present; Android lint and unit tests are enabled.'
          } else {
            'available=false' >> $env:GITHUB_OUTPUT
            Write-Output '::notice::Android lint/unit validation is gated because the checked-in Gradle wrapper JAR is unavailable.'
          }

  android-checks:
    needs: android-toolchain
    if: needs.android-toolchain.outputs.available == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install React Native dependencies
        working-directory: mobile
        run: npm ci
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's historical default includes the removed `tools`
          # package. Install only packages required by this project.
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install Android 17 preview platform
        shell: pwsh
        run: |
          $sdkmanager = Get-ChildItem -LiteralPath (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Filter 'sdkmanager.bat' -File -Recurse | Select-Object -First 1
          if (-not $sdkmanager) { throw 'Android SDK command-line tools were not installed.' }
          & $sdkmanager.FullName --install 'platforms;android-37.0' --channel=3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run Android lint and unit tests
        working-directory: android
        shell: pwsh
        env:
          ORG_GRADLE_PROJECT_borderLedgerCxxRoot: ${{ runner.temp }}/bl-cxx
        run: .\gradlew.bat lintDebug testDebugUnitTest --no-daemon

  android-checks-gated:
    needs: android-toolchain
    if: needs.android-toolchain.outputs.available != 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Report unavailable Android build prerequisites
        run: echo '::notice::Android lint/unit validation was intentionally gated; no Android build or test is claimed.'

