name: Deploy to Cloudflare production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run Worker/web quality gates
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Missing required Cloudflare deployment secret: CLOUDFLARE_API_TOKEN'
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Missing required Cloudflare deployment secret: CLOUDFLARE_ACCOUNT_ID'
            exit 1
          fi

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply border-ledger-production --remote --env production

      - name: Require production mobile authorization secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          secrets_json="$(npx wrangler secret list --env production --format json)"
          SECRETS_JSON="$secrets_json" node - <<'NODE'
          const secrets = JSON.parse(process.env.SECRETS_JSON);
          const names = new Set(secrets.map((secret) => secret.name));
          for (const name of ['MOBILE_ACCESS_AUTHORIZATION_URL', 'MOBILE_SESSION_ENCRYPTION_KEY']) {
            if (!names.has(name)) {
              console.error(`::error::Missing required production Worker secret: ${name}`);
              process.exit(1);
            }
          }
          NODE

      - name: Deploy the named production Worker and assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production --keep-vars --var "DEPLOYMENT_REVISION:${{ github.sha }}"

      - name: Smoke-test the production Worker and mobile auth contract
        env:
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          health_file="$RUNNER_TEMP/border-ledger-health.json"
          curl --fail --silent --show-error --location --max-time 30 --output "$health_file" https://pf.lofuyu.com/api/health
          HEALTH_FILE="$health_file" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.HEALTH_FILE, 'utf8'));
          if (body.ok !== true || body.service !== 'border-ledger-api' || body.deploymentRevision !== process.env.GITHUB_SHA) {
            console.error('::error::The public health endpoint did not identify this production Worker deployment.');
            process.exit(1);
          }
          NODE

          mobile_file="$RUNNER_TEMP/border-ledger-mobile-auth.json"
          mobile_status="$(curl --silent --show-error --location --max-time 30 --output "$mobile_file" --write-out '%{http_code}' \
            -X POST https://pf.lofuyu.com/api/mobile/v1/auth/requests \
            -H 'content-type: application/json' \
            --data '{"codeChallenge":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","state":"0123456789abcdef0123456789abcdef","deviceId":"ci-smoke"}')"
          if [[ "$mobile_status" != "201" ]]; then
            echo '::error::The production mobile auth start contract did not return HTTP 201.'
            cat "$mobile_file"
            exit 1
          fi
          MOBILE_FILE="$mobile_file" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.MOBILE_FILE, 'utf8'));
          if (!body.requestId || !body.authorizationUrl || !body.expiresAt) {
            console.error('::error::The production mobile auth response is missing required fields.');
            process.exit(1);
          }
          NODE
