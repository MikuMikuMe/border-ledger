name: Android validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-release-gates:
    runs-on: ubuntu-latest
    outputs:
      toolchain_available: ${{ steps.availability.outputs.toolchain_available }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Task 17 static gates
        shell: pwsh
        run: pwsh -NoProfile -File android/task17-static-check.ps1
      - name: Detect Gradle wrapper availability
        id: availability
        shell: pwsh
        run: |
          $wrapper = Test-Path -LiteralPath 'android/gradlew.bat' -PathType Leaf
          $jar = Test-Path -LiteralPath 'android/gradle/wrapper/gradle-wrapper.jar' -PathType Leaf
          if ($wrapper -and $jar) {
            'toolchain_available=true' >> $env:GITHUB_OUTPUT
            Write-Output 'Gradle wrapper script and JAR are present; Android build job is enabled.'
          } else {
            'toolchain_available=false' >> $env:GITHUB_OUTPUT
            Write-Output '::notice::Android Gradle job is gated: android/gradle/wrapper/gradle-wrapper.jar is unavailable.'
          }

  android-build:
    needs: static-release-gates
    if: needs.static-release-gates.outputs.toolchain_available == 'true' && github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install independent web test tooling
        run: npm ci
      - name: Validate React Native package
        working-directory: mobile
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run codegen
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run bundle:release
          exit $LASTEXITCODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # The action's historical default includes the removed `tools`
          # package. Install only packages required by this project.
          packages: platform-tools build-tools;36.0.0
      - name: Install Android 17 preview platform
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkmanager --install 'platforms;android-37.0' --channel=3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run Android lint, unit tests, and unsigned release assembly
        working-directory: android
        shell: pwsh
        env:
          ORG_GRADLE_PROJECT_borderLedgerCxxRoot: ${{ runner.temp }}/bl-cxx
        run: |
          .\gradlew.bat lintDebug testDebugUnitTest :sharedCore:testAndroidHostTest assembleDebug --no-daemon
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\gradlew.bat assembleRelease -PmobileEnvironment=production --no-daemon
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\react-native-host-check.ps1 -Merged

  ios-core:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install isolated mobile graph for Gradle autolinking
        working-directory: mobile
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Require specified macOS and Xcode
        shell: bash
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(xcodebuild -version | head -n1)" = 'Xcode 26.4.1'
          xcodebuild -version
      - name: Compile and link both iOS core targets
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew :sharedCore:compileKotlinIosArm64 :sharedCore:compileKotlinIosSimulatorArm64 :sharedCore:linkDebugFrameworkIosArm64 :sharedCore:linkDebugFrameworkIosSimulatorArm64 --no-daemon --console=plain
          test -f ../shared/core/build/bin/iosArm64/debugFramework/BorderLedgerCore.framework/BorderLedgerCore
          test -f ../shared/core/build/bin/iosSimulatorArm64/debugFramework/BorderLedgerCore.framework/BorderLedgerCore
          file ../shared/core/build/bin/iosArm64/debugFramework/BorderLedgerCore.framework/BorderLedgerCore
          file ../shared/core/build/bin/iosSimulatorArm64/debugFramework/BorderLedgerCore.framework/BorderLedgerCore
      - uses: actions/upload-artifact@v4
        with:
          name: ios-core-frameworks
          path: shared/core/build/bin/*/debugFramework/
          if-no-files-found: error

  android-instrumentation:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim disk space for Android SDK and native builds
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          tool-cache: false
          swap-storage: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install Android 17 preview platform
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" --channel=3
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: cd android && bash gradlew :app:connectedDebugAndroidTest -PreactNativeArchitectures=x86_64 --no-daemon --console=plain --max-workers=2 --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results
          path: android/app/build/reports/androidTests/
          if-no-files-found: error

  android-build-gated:
    needs: static-release-gates
    if: needs.static-release-gates.outputs.toolchain_available != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report unavailable Android build prerequisites
        run: echo 'Android Gradle validation was intentionally gated because the wrapper JAR is missing; no Android build or test is claimed.'

