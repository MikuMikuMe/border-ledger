<style>
:root{--paper:#f3efe6;--surface:#fbf9f4;--ink:#18201f;--muted:#656d6a;--rule:#d2ccc0;--accent:#1b6b5b;--tint:#dcebe3}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}
.diagram-container{overflow-x:auto;max-width:1280px;margin:0 auto}
svg{display:block;width:100%;min-width:1280px;height:auto}
.canvas{fill:var(--paper)}.zone{fill:none;stroke:var(--rule);stroke-width:1}.node{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:2}
.heading{font-family:'IBM Plex Sans',Arial,sans-serif;font-size:40px;font-weight:600;fill:var(--ink)}
.name{font-family:'DM Sans',Arial,sans-serif;font-size:20px;font-weight:600;fill:var(--ink)}.detail{font-family:'DM Sans',Arial,sans-serif;font-size:16px;fill:var(--ink)}
.group{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:1px;fill:var(--muted)}.label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.6px;fill:var(--ink)}.note{font-family:'DM Sans',Arial,sans-serif;font-size:14px;fill:var(--muted)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.8;marker-end:url(#bl-arrow)}.optional{stroke-dasharray:6 5}.label-bg{fill:var(--paper)}
@media print{.diagram-container{overflow:visible}svg{min-width:0}}
</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="bl-architecture-title bl-architecture-desc">
<title id="bl-architecture-title">Border Ledger architecture</title>
<desc id="bl-architecture-desc">The React web app and React Native Android app authenticate to a Cloudflare Worker. The Worker reads and writes ledger-scoped records in D1, schedules and consumes bank synchronization through Queues, and calls financial providers. Optional user-initiated AI requests go directly from the Worker to fixed official provider APIs. A separate egress service exists in the repository but is not wired into this runtime. The accompanying README explains authentication, data boundaries, features, and deployment.</desc>
